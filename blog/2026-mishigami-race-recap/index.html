<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Unlisted: keep this out of search results and off the sitemap -->
    <meta name="robots" content="noindex, nofollow">
    <meta name="description" content="2026 Mishigami Race Recap. A post by Jenny Terlinden.">
    <title>2026 Mishigami Race Recap | Jenny Terlinden</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* Keep these values in sync with index.html and the blog listing. */
        :root {
            --bg: #131211;
            --surface: #1a1918;
            --border: #2c2a27;
            --border-strong: #3a3733;
            --text: #e7e4df;
            --heading: #f3f1ed;
            --muted: #9b958c;
            --accent: #c47f83;
            --accent-dim: #a86a6e;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.7;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }

        .post {
            max-width: 720px;
            margin: 0 auto;
            padding: 6rem 1.5rem 4rem;
        }

        .back-link {
            display: inline-block;
            color: var(--muted);
            text-decoration: none;
            font-size: 0.9rem;
            letter-spacing: 0.05em;
            margin-bottom: 3rem;
            transition: color 0.2s ease;
        }

        .back-link:hover {
            color: var(--accent);
        }

        .post-title {
            font-size: clamp(1.9rem, 5vw, 2.6rem);
            font-weight: 600;
            line-height: 1.2;
            letter-spacing: -0.02em;
            margin-bottom: 0.75rem;
            color: var(--heading);
        }

        .post-meta {
            color: var(--muted);
            font-size: 0.9rem;
            letter-spacing: 0.05em;
            margin-bottom: 2.5rem;
            padding-bottom: 2rem;
            border-bottom: 1px solid var(--border);
        }

        .post-body p {
            margin-bottom: 1.5rem;
            color: var(--text);
        }

        .post-body h2 {
            font-size: 1.3rem;
            font-weight: 600;
            margin: 2.5rem 0 1rem;
            color: var(--heading);
        }

        .post-body a {
            color: var(--accent);
            text-decoration-color: rgba(196, 127, 131, 0.4);
            text-underline-offset: 3px;
        }

        .post-body a:hover {
            text-decoration-color: var(--accent);
        }
    </style>
</head>
<body>
    <article class="post">
        <a class="back-link" href="https://www.jennyterlinden.com/">&larr; jennyterlinden.com</a>

        <h1 class="post-title">2026 Mishigami Race Recap</h1>
        <div class="post-meta"><time class="post-date" datetime="2026-07-21">July 21, 2026</time></div>

        <div class="post-body">
            <p>This is a placeholder for a post. Replace this text with whatever you want to share.</p>

            <p>Only people with this link can find it. It isn't linked from the homepage and it's marked to stay out of search results.</p>
        </div>
    </article>
</body>
</html>
